# nginx-cache-build CI pipeline
#
# Job graph:
#   get-official -> smoke-official -> build-native -> [smoke-compiled] -> verify-binary -> publish
#
# Build target: nginx static aarch64-musl for AURELIO (GL-BE9300, OpenWrt aarch64).
# Runner: ubuntu-24.04-arm (Cobalt 100 Neoverse N2, ARMv9-A).
# Compilation: native aarch64. -mcpu=cortex-a53 sets ABI baseline for target.
# C library: musl static via apt-installed musl-tools (musl-gcc wrapper).
#
# get-official: installs nginx from apt (native aarch64), runs trivy SAST against
#   the official nginx:VERSION-alpine image.
#   NOTE: apt-installed version may not match NGINX_VERSION input; SAST runs
#   against the specific tag via Docker Hub. Divergence is expected.
# smoke-official: validates HTTP contract against the official binary.
# build-native: compiles nginx aarch64-musl static. PCRE2 is built as a source tree
#   (nginx compiles it internally with musl-gcc).
#   TODO gzip: add zlib build from source with musl-gcc, --with-zlib=path,
#     remove --without-http_gzip_module.
# smoke-compiled: validates HTTP contract against the freshly built binary.
#   Possible because runner and target share aarch64.
# verify-binary: static checks (ELF aarch64, no dynamic deps).
# publish: bundles SBOM, SHA256, cosign signature, SAST.

name: nginx-ci

on:
  workflow_dispatch:
    inputs:
      nginx_version:
        description: "nginx version (e.g. 1.26.3)"
        required: true
        default: "1.26.3"
        type: string
      run_new_build:
        description: "Run new build (or smoke-official only)"
        required: true
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
      run_smoke_compiled:
        description: "Run smoke tests against the compiled binary"
        required: true
        default: "true"
        type: choice
        options:
          - "false"
          - "true"

permissions:
  contents: read

env:
  NGINX_VERSION: ${{ inputs.nginx_version }}
  ARCH: "aarch64"
  OS: "linux"
  VARIANT: "musl"
  COSIGN_VERSION: "v3.0.6"
  COSIGN_SHA256: "bedac92e8c3729864e13d4a17048007cfafa79d5deca993a43a90ffe018ef2b8"
  ARTIFACT_BASE: "nginx-${{ inputs.nginx_version }}-aarch64-linux-musl"
  PCRE2_VERSION: "10.44"
  OPENSSL_VERSION: "3.5.6"
  OPENSSL_SHA256: "deae7c80cba99c4b4f940ecadb3c3338b13cb77418409238e57d7f31f2a3b736"
  ZLIB_VERSION: "1.3.2"
  ZLIB_SHA256: "bb329a0a2cd0274d05519d61c667c062e06990d72e125ee2dfa8de64f0119d16"

jobs:

  get-official:
    name: "Get official nginx + SAST"
    runs-on: ubuntu-24.04-arm

    permissions:
      contents: read

    steps:
      - name: "Install nginx from apt"
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends nginx netcat-openbsd
          NGINX_BIN=$(which nginx)
          echo "time=$(date -u +%Y-%m-%dT%H:%M:%SZ) level=info event=official_installed version=$(nginx -v 2>&1) path=$NGINX_BIN arch=$(uname -m)"
          cp "$NGINX_BIN" /tmp/nginx

      - name: "Upload official binary"
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: "nginx-official"
          path: /tmp/nginx
          retention-days: 1
          if-no-files-found: error

      - name: "SAST: trivy scan nginx:${{ env.NGINX_VERSION }}-alpine"
        run: |
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh \
            | sh -s -- -b /usr/local/bin
          trivy image \
            --format json \
            --output "${{ env.ARTIFACT_BASE }}.sast.json" \
            --exit-code 0 \
            "nginx:${{ env.NGINX_VERSION }}-alpine"
          echo "time=$(date -u +%Y-%m-%dT%H:%M:%SZ) level=info event=sast target=nginx:${{ env.NGINX_VERSION }}-alpine format=json"

      - name: "Upload SAST report"
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: "sast-report"
          path: "${{ env.ARTIFACT_BASE }}.sast.json"
          retention-days: 1
          if-no-files-found: error

  smoke-official:
    uses: ./.github/workflows/smoke-tests.yml
    with:
      build_type: "official"
    needs: get-official

  build-native:
    name: "Build nginx ${{ inputs.nginx_version }} aarch64-musl"
    if: ${{ inputs.run_new_build == 'true' }}
    runs-on: ubuntu-24.04-arm
    needs: smoke-official

    container:
      image: alpine:3.20

    permissions:
      contents: read
      id-token: write

    steps:
      - name: "Install build dependencies"
        run: |
          # Alpine is musl-native: gcc here is musl-gcc by default. No need for
          # the musl-tools wrapper. FORTIFY_SOURCE is not injected by Alpine's
          # build flags, eliminating the __chk symbol class entirely.
          apk add --no-cache \
            build-base \
            curl \
            linux-headers \
            perl \
            tar \
            file \
            findutils
          echo "time=$(date -u +%Y-%m-%dT%H:%M:%SZ) level=info event=deps_installed cc=$(gcc --version | head -1) arch=$(uname -m)"

      - name: "Checkout"
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: "Download PCRE2 ${{ env.PCRE2_VERSION }} source"
        run: |
          curl -fsSL "https://github.com/PCRE2Project/pcre2/releases/download/pcre2-${{ env.PCRE2_VERSION }}/pcre2-${{ env.PCRE2_VERSION }}.tar.gz" \
            -o /tmp/pcre2.tar.gz
          # TODO supply-chain: pin tarball SHA256 and verify before extracting.
          cd /tmp && tar -xf pcre2.tar.gz
          test -f /tmp/pcre2-${{ env.PCRE2_VERSION }}/src/pcre2.h.generic
          echo "time=$(date -u +%Y-%m-%dT%H:%M:%SZ) level=info event=pcre2_source_ready version=${{ env.PCRE2_VERSION }}"

      - name: "Download openssl ${{ env.OPENSSL_VERSION }} source"
        run: |
          curl -fsSL "https://github.com/openssl/openssl/releases/download/openssl-${{ env.OPENSSL_VERSION }}/openssl-${{ env.OPENSSL_VERSION }}.tar.gz" \
            -o /tmp/openssl.tar.gz
          # TODO supply-chain: pin OpenSSL tarball SHA256 and verify before extracting.
          cd /tmp && tar -xzf openssl.tar.gz
          echo "time=$(date -u +%Y-%m-%dT%H:%M:%SZ) level=info event=openssl_downloaded version=${{ env.OPENSSL_VERSION }}"

      - name: "Download zlib ${{ env.ZLIB_VERSION }} source"
        run: |
          curl -fsSL "https://github.com/madler/zlib/releases/download/v${{ env.ZLIB_VERSION }}/zlib-${{ env.ZLIB_VERSION }}.tar.gz" \
            -o /tmp/zlib.tar.gz
          # TODO supply-chain: pin tarball SHA256 and verify before extracting.
          cd /tmp && tar -xzf zlib.tar.gz
          test -f /tmp/zlib-${{ env.ZLIB_VERSION }}/zlib.h
          echo "time=$(date -u +%Y-%m-%dT%H:%M:%SZ) level=info event=zlib_source_ready version=${{ env.ZLIB_VERSION }}"

      - name: "Download nginx ${{ env.NGINX_VERSION }} source"
        run: |
          curl -fsSL "https://nginx.org/download/nginx-${{ env.NGINX_VERSION }}.tar.gz" \
            -o /tmp/nginx.tar.gz
          # TODO supply-chain: pin tarball SHA256 and verify before extracting.
          cd /tmp && tar -xf nginx.tar.gz
          echo "time=$(date -u +%Y-%m-%dT%H:%M:%SZ) level=info event=source_downloaded version=${{ env.NGINX_VERSION }}"

      - name: "Patch nginx ngx_linux_config.h for musl compat"
        run: |
          # nginx 1.26.x ngx_linux_config.h does an unconditional #include <crypt.h>.
          # Alpine ships libxcrypt (provides crypt.h via apk add libxcrypt-dev) but
          # we keep the gate to remain portable for non-libxcrypt musl targets.
          # TODO upstream: contribute a proper gating patch to nginx.
          sed -i 's|^#include <crypt.h>|#if defined(__GLIBC__)\n#include <crypt.h>\n#endif|' \
            /tmp/nginx-${{ env.NGINX_VERSION }}/src/os/unix/ngx_linux_config.h
          grep -A2 -B1 '__GLIBC__' /tmp/nginx-${{ env.NGINX_VERSION }}/src/os/unix/ngx_linux_config.h \
            || { echo "level=error event=patch_failed"; exit 1; }
          echo "time=$(date -u +%Y-%m-%dT%H:%M:%SZ) level=info event=nginx_patched file=ngx_linux_config.h"

      - name: "Build nginx aarch64 musl static"
        run: |
          cd /tmp/nginx-${{ env.NGINX_VERSION }}
          # On Alpine, gcc IS musl-gcc. No --with-cc=musl-gcc needed.
          # OpenSSL no-engine drops legacy engine API, no-afalgeng drops AFALG,
          # no-tests skips test binaries we don't ship.
          ./configure \
            --with-cc-opt="-mcpu=cortex-a53 -Os" \
            --with-ld-opt="-static" \
            --with-pcre=/tmp/pcre2-${{ env.PCRE2_VERSION }} \
            --with-http_v2_module \
            --with-http_realip_module \
            --with-http_stub_status_module \
            --with-http_ssl_module \
            --with-openssl=/tmp/openssl-${{ env.OPENSSL_VERSION }} \
            --with-openssl-opt="no-shared no-afalgeng no-async no-engine no-tests" \
            --with-zlib=/tmp/zlib-${{ env.ZLIB_VERSION }} \
            --without-http_scgi_module \
            --without-http_uwsgi_module \
            --without-http_fastcgi_module \
            --prefix=/usr/local/nginx \
            --pid-path=/var/run/nginx.pid \
            --error-log-path=/var/log/nginx/error.log \
            --http-log-path=/var/log/nginx/access.log \
            --http-client-body-temp-path=/var/lib/nginx/body \
            --http-proxy-temp-path=/var/lib/nginx/proxy
          make -j$(nproc)
          BINARY="objs/nginx"
          echo "time=$(date -u +%Y-%m-%dT%H:%M:%SZ) level=info event=build_done size=$(du -sh $BINARY | cut -f1) sha256=$(sha256sum $BINARY | cut -d' ' -f1)"

      - name: "Compute SHA256"
        uses: wererootops/actions/checksum@6b20e28e61d3fa74529f18a1e162168af025b879  # v1.0.0
        with:
          path: "/tmp/nginx-${{ env.NGINX_VERSION }}/objs/nginx"
          output_file: "${{ env.ARTIFACT_BASE }}.sha256"

      - name: "Generate SBOM"
        run: |
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh \
            | sh -s -- -b /usr/local/bin
          trivy fs \
            --format cyclonedx \
            --output "${{ env.ARTIFACT_BASE }}.sbom.cdx.json" \
            /tmp/nginx-${{ env.NGINX_VERSION }}/
          echo "time=$(date -u +%Y-%m-%dT%H:%M:%SZ) level=info event=sbom format=cyclonedx"

      - name: "Prepare bundle"
        run: |
          mkdir -p bundle
          cp /tmp/nginx-${{ env.NGINX_VERSION }}/objs/nginx \
            bundle/${{ env.ARTIFACT_BASE }}
          # Stable filename for downstream jobs (smoke tests, verify) that don't
          # care about versioning. Versioned name is preserved for release.
          cp /tmp/nginx-${{ env.NGINX_VERSION }}/objs/nginx \
            bundle/nginx
          cp ${{ env.ARTIFACT_BASE }}.sha256 bundle/
          cp ${{ env.ARTIFACT_BASE }}.sbom.cdx.json bundle/

      - name: "Sign binary"
        uses: wererootops/actions/sign@6b20e28e61d3fa74529f18a1e162168af025b879  # v1.0.0
        with:
          path: "bundle/${{ env.ARTIFACT_BASE }}"
          bundle_output: "bundle/${{ env.ARTIFACT_BASE }}.cosign.bundle"
          cosign_version: "${{ env.COSIGN_VERSION }}"
          cosign_sha256: "${{ env.COSIGN_SHA256 }}"

      - name: "Upload binary for downstream jobs"
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: "nginx-compiled"
          path: "bundle/nginx"
          retention-days: 1
          if-no-files-found: error

      - name: "Upload full bundle"
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: "${{ env.ARTIFACT_BASE }}-bundle"
          path: bundle/
          retention-days: 1
          if-no-files-found: error
