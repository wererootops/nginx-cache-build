# nginx-cache-build CI pipeline
#
# Job graph:
#   get-official -> smoke-official -> build-native -> [smoke-compiled] -> verify-binary -> publish
#
# Build target: nginx static aarch64-musl for AURELIO (GL-BE9300, OpenWrt aarch64).
# Runner: ubuntu-24.04-arm (Cobalt 100 Neoverse N2, ARMv9-A).
# Compilation: native aarch64. -mcpu=cortex-a53 sets ABI baseline for target.
# C library: musl static via apt-installed musl-tools (musl-gcc wrapper).
#
# SAST chain: anchore (syft for SBOM, grype for vuln scan) is the primary
#   scanner across both upstream and build artifacts. Trivy retained in
#   parallel inside get-official as double-check against grype on the
#   official alpine image. Migrated from trivy-as-primary after the
#   March 2026 trivy-action compromise (UNC6780 / TeamPCP).
#
# get-official: pulls nginx:VERSION-alpine and produces SBOM (syft, CycloneDX
#   from registry image) plus vuln scan (grype on the SBOM, plus trivy image
#   in parallel as double-check). Also installs nginx from apt for the smoke
#   test downstream.
#   NOTE: apt-installed binary version may not match NGINX_VERSION input;
#   the SBOM and scans target the alpine tag explicitly. Divergence expected.
# smoke-official: validates HTTP contract against the official binary.
# build-native: compiles nginx aarch64-musl static linked against PCRE2 from
#   source. After build, generates a declarative CycloneDX SBOM via jq
#   listing the three components linked in: nginx (NGINX_VERSION), pcre2
#   (PCRE2_VERSION), musl (from runner musl-tools). Grype scans the SBOM via
#   CPE matching.
#   Trivy not viable on this SBOM: trivy sbom is OS-package-centric and bails
#   out on the pkg:generic PURLs used here (validated empirically in run
#   26252203568).
#   No SSL: OpenSSL static-musl aarch64 build did not succeed on target after
#     multiple attempts. Deploy host (AURELIO) runs a separate factory
#     nginx-ssl alongside this cache for TLS termination.
#   TODO gzip: add zlib build from source with musl-gcc, --with-zlib=path,
#     remove --without-http_gzip_module.
# smoke-compiled: validates HTTP contract against the freshly built binary.
#   Possible because runner and target share aarch64.
# verify-binary: static checks (ELF aarch64, no dynamic deps).
# publish: bundles binary, SHA256, declarative SBOM, cosign signature, grype
#   audit report.

name: nginx-ci

on:
  workflow_dispatch:
    inputs:
      nginx_version:
        description: "nginx version (e.g. 1.26.3)"
        required: true
        default: "1.30.1"   # was: "1.26.3"
        type: string
      run_new_build:
        description: "Run new build (or smoke-official only)"
        required: true
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
      run_smoke_compiled:
        description: "Run smoke tests against the compiled binary"
        required: true
        default: "true"
        type: choice
        options:
          - "false"
          - "true"

permissions:
  contents: read

env:
  NGINX_VERSION: ${{ inputs.nginx_version }}
  ARCH: "aarch64"
  OS: "linux"
  VARIANT: "musl"
  COSIGN_VERSION: "v3.0.6"
  COSIGN_SHA256: "bedac92e8c3729864e13d4a17048007cfafa79d5deca993a43a90ffe018ef2b8"
  ARTIFACT_BASE: "nginx-${{ inputs.nginx_version }}-aarch64-linux-musl"
  OFFICIAL_BASE: "nginx-${{ inputs.nginx_version }}-alpine-official"
  PCRE2_VERSION: "10.44"
  # TODO SSL: OPENSSL_VERSION: "3.x.y"
  # TODO gzip: ZLIB_VERSION: "1.3.1"

jobs:

  get-official:
    name: "Get official nginx + SAST"
    runs-on: ubuntu-24.04-arm

    permissions:
      contents: read

    steps:
      - name: "Install nginx from apt"
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends nginx netcat-openbsd
          NGINX_BIN=$(which nginx)
          echo "time=$(date -u +%Y-%m-%dT%H:%M:%SZ) level=info event=official_installed version=$(nginx -v 2>&1) path=$NGINX_BIN arch=$(uname -m)"
          cp "$NGINX_BIN" /tmp/nginx

      - name: "Upload official binary"
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: "nginx-official"
          path: /tmp/nginx
          retention-days: 1
          if-no-files-found: error

      # SAST chain: anchore (syft -> grype) is the primary scanner.
      # Trivy is kept in parallel as a double-check during the migration window.

      - name: "SBOM: syft scan registry:nginx:${{ env.NGINX_VERSION }}-alpine"
        uses: wererootops/actions/sbom@f474cbdcf8f0fb02b8f81b8d8df543b0e89b53d6  # v1.2.0
        with:
          target: "registry:nginx:${{ env.NGINX_VERSION }}-alpine"
          output_file: "${{ env.OFFICIAL_BASE }}.sbom.cdx.json"
          format: "cyclonedx-json"
          syft_version: "v1.44.0"
          cosign_version: "${{ env.COSIGN_VERSION }}"
          cosign_sha256: "${{ env.COSIGN_SHA256 }}"

      - name: "Upload SBOM"
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: "sbom-official"
          path: "${{ env.OFFICIAL_BASE }}.sbom.cdx.json"
          retention-days: 1
          if-no-files-found: error

      - name: "SAST: grype scan SBOM"
        uses: wererootops/actions/sast-container@f474cbdcf8f0fb02b8f81b8d8df543b0e89b53d6  # v1.2.0
        with:
          sbom_path: "${{ env.OFFICIAL_BASE }}.sbom.cdx.json"
          output_file: "${{ env.OFFICIAL_BASE }}.grype.json"
          format: "json"
          grype_version: "v0.112.0"
          cosign_version: "${{ env.COSIGN_VERSION }}"
          cosign_sha256: "${{ env.COSIGN_SHA256 }}"

      - name: "Upload grype audit report"
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: "grype-report"
          path: "${{ env.OFFICIAL_BASE }}.grype.json"
          retention-days: 1
          if-no-files-found: error

      # Trivy kept in parallel as double-check.
      # TODO migration-window: remove once anchore is validated as sole SAST.
      - name: "SAST: trivy scan nginx:${{ env.NGINX_VERSION }}-alpine"
        run: |
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh \
            | sh -s -- -b /usr/local/bin
          trivy image \
            --format json \
            --output "${{ env.OFFICIAL_BASE }}.sast.json" \
            --exit-code 0 \
            "nginx:${{ env.NGINX_VERSION }}-alpine"
          echo "time=$(date -u +%Y-%m-%dT%H:%M:%SZ) level=info event=sast target=nginx:${{ env.NGINX_VERSION }}-alpine format=json scanner=trivy"

      - name: "Upload SAST report"
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: "sast-report"
          path: "${{ env.OFFICIAL_BASE }}.sast.json"
          retention-days: 1
          if-no-files-found: error

  smoke-official:
    uses: ./.github/workflows/smoke-tests.yml
    with:
      build_type: "official"
    needs: get-official

  build-native:
    name: "Build nginx ${{ inputs.nginx_version }} aarch64-musl"
    if: ${{ inputs.run_new_build == 'true' }}
    runs-on: ubuntu-24.04-arm
    needs: smoke-official

    permissions:
      contents: read
      id-token: write

    steps:
      - name: "Checkout"
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: "Install musl-tools"
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends musl-tools
          echo "time=$(date -u +%Y-%m-%dT%H:%M:%SZ) level=info event=musl_ready version=$(musl-gcc --version | head -1)"

      - name: "Download PCRE2 ${{ env.PCRE2_VERSION }} source"
        run: |
          curl -fsSL "https://github.com/PCRE2Project/pcre2/releases/download/pcre2-${{ env.PCRE2_VERSION }}/pcre2-${{ env.PCRE2_VERSION }}.tar.gz" \
            -o /tmp/pcre2.tar.gz
          # TODO supply-chain: pin tarball SHA256 and verify before extracting.
          cd /tmp && tar -xf pcre2.tar.gz
          test -f /tmp/pcre2-${{ env.PCRE2_VERSION }}/src/pcre2.h.generic
          echo "time=$(date -u +%Y-%m-%dT%H:%M:%SZ) level=info event=pcre2_source_ready version=${{ env.PCRE2_VERSION }}"

      # TODO SSL: add a "Download OpenSSL source" step analogous to PCRE2.
      # TODO gzip: add a "Download zlib source" step analogous to PCRE2.

      - name: "Download nginx ${{ env.NGINX_VERSION }} source"
        run: |
          curl -fsSL "https://nginx.org/download/nginx-${{ env.NGINX_VERSION }}.tar.gz" \
            -o /tmp/nginx.tar.gz
          # TODO supply-chain: pin tarball SHA256 and verify before extracting.
          cd /tmp && tar -xf nginx.tar.gz
          echo "time=$(date -u +%Y-%m-%dT%H:%M:%SZ) level=info event=source_downloaded version=${{ env.NGINX_VERSION }}"

      - name: "Patch nginx ngx_linux_config.h for musl compat"
        run: |
          # nginx 1.26.x ngx_linux_config.h does an unconditional #include <crypt.h>.
          # crypt.h is glibc-specific; musl declares crypt() elsewhere but does not
          # ship the header. Gate the include behind __GLIBC__.
          # TODO upstream: contribute a proper gating patch to nginx.
          sed -i 's|^#include <crypt.h>|#if defined(__GLIBC__)\n#include <crypt.h>\n#endif|' \
            /tmp/nginx-${{ env.NGINX_VERSION }}/src/os/unix/ngx_linux_config.h
          grep -A2 -B1 '__GLIBC__' /tmp/nginx-${{ env.NGINX_VERSION }}/src/os/unix/ngx_linux_config.h \
            || { echo "level=error event=patch_failed"; exit 1; }
          echo "time=$(date -u +%Y-%m-%dT%H:%M:%SZ) level=info event=nginx_patched file=ngx_linux_config.h"

      - name: "Build nginx aarch64 musl static"
        run: |
          cd /tmp/nginx-${{ env.NGINX_VERSION }}
          ./configure \
            --with-cc=musl-gcc \
            --with-cc-opt="-mcpu=cortex-a53 -Os" \
            --with-ld-opt="-static" \
            --with-pcre=/tmp/pcre2-${{ env.PCRE2_VERSION }} \
            --with-http_v2_module \
            --with-http_realip_module \
            --with-http_stub_status_module \
            --without-http_gzip_module \
            --without-http_scgi_module \
            --without-http_uwsgi_module \
            --without-http_fastcgi_module \
            --prefix=/usr/local/nginx \
            --pid-path=/var/run/nginx.pid \
            --error-log-path=/var/log/nginx/error.log \
            --http-log-path=/var/log/nginx/access.log \
            --http-client-body-temp-path=/var/lib/nginx/body \
            --http-proxy-temp-path=/var/lib/nginx/proxy
          # TODO SSL: add --with-http_ssl_module and --with-openssl=/tmp/openssl-${OPENSSL_VERSION}
          # TODO gzip: drop --without-http_gzip_module and add --with-zlib=/tmp/zlib-${ZLIB_VERSION}
          make -j$(nproc)
          BINARY="objs/nginx"
          echo "time=$(date -u +%Y-%m-%dT%H:%M:%SZ) level=info event=build_done size=$(du -sh $BINARY | cut -f1) sha256=$(sha256sum $BINARY | cut -d' ' -f1)"

      - name: "Compute SHA256"
        uses: wererootops/actions/checksum@f474cbdcf8f0fb02b8f81b8d8df543b0e89b53d6  # v1.2.0
        with:
          path: "/tmp/nginx-${{ env.NGINX_VERSION }}/objs/nginx"
          output_file: "${{ env.ARTIFACT_BASE }}.sha256"

      - name: "Generate SBOM (declarative CycloneDX)"
        run: |
          BUILD_TIMESTAMP=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          MUSL_VERSION=$(dpkg-query -W -f='${Version}' musl-tools 2>/dev/null || echo "unknown")
          SERIAL_UUID="urn:uuid:$(cat /proc/sys/kernel/random/uuid)"

          jq -n \
            --arg nginx_version "${{ env.NGINX_VERSION }}" \
            --arg pcre2_version "${{ env.PCRE2_VERSION }}" \
            --arg musl_version "$MUSL_VERSION" \
            --arg timestamp "$BUILD_TIMESTAMP" \
            --arg serial "$SERIAL_UUID" \
            --arg artifact "${{ env.ARTIFACT_BASE }}" \
            '{
              "$schema": "http://cyclonedx.org/schema/bom-1.6.schema.json",
              bomFormat: "CycloneDX",
              specVersion: "1.6",
              serialNumber: $serial,
              version: 1,
              metadata: {
                timestamp: $timestamp,
                tools: {
                  components: [
                    { type: "application", name: "wererootops/nginx-cache-build", version: "1.0" }
                  ]
                },
                component: {
                  type: "application",
                  name: $artifact,
                  version: $nginx_version,
                  description: "nginx static-musl build for aarch64",
                  cpe: ("cpe:2.3:a:nginx:nginx:" + $nginx_version + ":*:*:*:*:*:*:*")
                }
              },
              components: [
                {
                  type: "library",
                  "bom-ref": "nginx",
                  name: "nginx",
                  version: $nginx_version,
                  purl: ("pkg:generic/nginx@" + $nginx_version),
                  cpe: ("cpe:2.3:a:nginx:nginx:" + $nginx_version + ":*:*:*:*:*:*:*")
                },
                {
                  type: "library",
                  "bom-ref": "pcre2",
                  name: "pcre2",
                  version: $pcre2_version,
                  purl: ("pkg:generic/pcre2@" + $pcre2_version),
                  cpe: ("cpe:2.3:a:pcre2:pcre2:" + $pcre2_version + ":*:*:*:*:*:*:*")
                },
                {
                  type: "library",
                  "bom-ref": "musl",
                  name: "musl",
                  version: $musl_version,
                  purl: ("pkg:deb/ubuntu/musl-tools@" + $musl_version + "?arch=arm64"),
                  cpe: ("cpe:2.3:a:musl-libc:musl:" + $musl_version + ":*:*:*:*:*:*:*")
                }
              ]
            }' > "${{ env.ARTIFACT_BASE }}.sbom.cdx.json"

          echo "time=$(date -u +%Y-%m-%dT%H:%M:%SZ) level=info event=sbom_generated format=cyclonedx-json target=declarative nginx=${{ env.NGINX_VERSION }} pcre2=${{ env.PCRE2_VERSION }} musl=$MUSL_VERSION"

      - name: "SAST: grype scan build SBOM"
        uses: wererootops/actions/sast-container@f474cbdcf8f0fb02b8f81b8d8df543b0e89b53d6  # v1.2.0
        with:
          sbom_path: "${{ env.ARTIFACT_BASE }}.sbom.cdx.json"
          output_file: "${{ env.ARTIFACT_BASE }}.grype.json"
          format: "json"
          grype_version: "v0.112.0"
          cosign_version: "${{ env.COSIGN_VERSION }}"
          cosign_sha256: "${{ env.COSIGN_SHA256 }}"

      - name: "Prepare bundle"
        run: |
          mkdir -p bundle
          cp /tmp/nginx-${{ env.NGINX_VERSION }}/objs/nginx \
            bundle/${{ env.ARTIFACT_BASE }}
          cp /tmp/nginx-${{ env.NGINX_VERSION }}/objs/nginx \
            bundle/nginx
          cp ${{ env.ARTIFACT_BASE }}.sha256 bundle/
          cp ${{ env.ARTIFACT_BASE }}.sbom.cdx.json bundle/
          cp ${{ env.ARTIFACT_BASE }}.grype.json bundle/

      - name: "Sign binary"
        uses: wererootops/actions/sign@f474cbdcf8f0fb02b8f81b8d8df543b0e89b53d6  # v1.2.0
        with:
          path: "bundle/${{ env.ARTIFACT_BASE }}"
          bundle_output: "bundle/${{ env.ARTIFACT_BASE }}.cosign.bundle"
          cosign_version: "${{ env.COSIGN_VERSION }}"
          cosign_sha256: "${{ env.COSIGN_SHA256 }}"

      - name: "Upload binary for downstream jobs"
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: "nginx-compiled"
          path: "bundle/nginx"
          retention-days: 1
          if-no-files-found: error

      - name: "Upload full bundle"
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: "${{ env.ARTIFACT_BASE }}-bundle"
          path: bundle/
          retention-days: 1
          if-no-files-found: error

  smoke-compiled:
    if: ${{ inputs.run_new_build == 'true' && inputs.run_smoke_compiled == 'true' }}
    uses: ./.github/workflows/smoke-tests.yml
    with:
      build_type: "compiled"
    needs: build-native

  verify-binary:
    name: "Verify aarch64 binary"
    if: ${{ inputs.run_new_build == 'true' }}
    runs-on: ubuntu-24.04-arm
    needs: build-native

    permissions:
      contents: read

    steps:
      - name: "Download compiled binary"
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: "nginx-compiled"
          path: /tmp/nginx-bin

      - name: "Verify binary"
        run: |
          BINARY="/tmp/nginx-bin/${{ env.ARTIFACT_BASE }}"

          ARCH=$(file "$BINARY" | grep -o "aarch64\|ARM aarch64")
          echo "time=$(date -u +%Y-%m-%dT%H:%M:%SZ) level=info event=verify test=arch result=$ARCH"
          echo "$ARCH" | grep -q "aarch64" || { echo "level=error test=arch result=fail"; exit 1; }

          INTERP=$(readelf -l "$BINARY" 2>/dev/null | grep "program interpreter" || echo "none")
          echo "time=$(date -u +%Y-%m-%dT%H:%M:%SZ) level=info event=verify test=static interp=$INTERP"
          [ "$INTERP" = "none" ] || { echo "level=error test=static result=fail interp=$INTERP"; exit 1; }

          echo "time=$(date -u +%Y-%m-%dT%H:%M:%SZ) level=info event=verify result=pass"

  publish:
    name: "Publish release"
    if: ${{ inputs.run_new_build == 'true' }}
    runs-on: ubuntu-24.04-arm
    needs: [verify-binary, smoke-compiled]

    permissions:
      contents: read

    steps:
      - name: "Download full bundle"
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: "${{ env.ARTIFACT_BASE }}-bundle"
          path: bundle/

      - name: "Download SAST report"
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: "sast-report"
          path: bundle/

      - name: "Package release"
        uses: wererootops/actions/release@f474cbdcf8f0fb02b8f81b8d8df543b0e89b53d6  # v1.2.0
        with:
          binary_path: "bundle/${{ env.ARTIFACT_BASE }}"
          binary_name: "nginx"
          version: "${{ env.NGINX_VERSION }}"
          arch: "aarch64"
          os: "linux"
          variant: "musl"
          sha256_path: "bundle/${{ env.ARTIFACT_BASE }}.sha256"
          sbom_path: "bundle/${{ env.ARTIFACT_BASE }}.sbom.cdx.json"
          cosign_bundle_path: "bundle/${{ env.ARTIFACT_BASE }}.cosign.bundle"
          # was: sast_report_path: "bundle/${{ env.ARTIFACT_BASE }}.sast.json"
          sast_report_path: "bundle/${{ env.ARTIFACT_BASE }}.grype.json"
          output_dir: "rc"

      - name: "Upload release candidate"
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: "${{ env.ARTIFACT_BASE }}"
          path: rc/
          retention-days: 14
          if-no-files-found: error

