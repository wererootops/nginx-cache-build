# nginx-cache-build CI pipeline
#
# Job graph:
#   get-official → smoke-official → build-native → verify-binary → publish
#
# Build target: nginx static aarch64-musl para AURELIO (GL-BE9300, OpenWrt aarch64).
# Runner: ubuntu-24.04-arm (Cobalt 100 Neoverse N2, ARMv9-A).
# Compilación: nativa aarch64. -mcpu=cortex-a53 fija ABI baseline para target.
# C library: musl static via apt-installed musl-tools (musl-gcc wrapper).
#
# get-official: instala nginx desde apt (aarch64 nativo), corre SAST con trivy contra
#   imagen oficial nginx:VERSION-alpine.
#   NOTA: la version apt-instalada puede no coincidir con NGINX_VERSION del input;
#   el SAST se hace contra el tag específico vía docker hub. Divergencia esperada.
# smoke-official: valida contrato HTTP contra binario oficial.
# build-native: compila nginx aarch64-musl static. PCRE2 buildeada como source tree
#   (nginx la compila internamente con musl-gcc).
#   TODO SSL: agregar build de OpenSSL desde fuente con musl-gcc, --with-openssl=path,
#     --with-http_ssl_module en configure.
#   TODO gzip: agregar build de zlib desde fuente con musl-gcc, --with-zlib=path,
#     remover --without-http_gzip_module.
# verify-binary: checks estáticos (ELF aarch64, sin deps dinámicas).
# publish: empaqueta bundle con SBOM, SHA256, cosign, SAST.
#
# TODO smoke-compiled: ahora que el binario es ejecutable en el runner (mismo ARCH),
#   reusar ./.github/workflows/smoke-tests.yml con build_type=compiled antes de publish.

name: nginx-ci

on:
  workflow_dispatch:
    inputs:
      nginx_version:
        description: "nginx version (e.g. 1.26.3)"
        required: true
        default: "1.26.3"
        type: string
      run_new_build:
        description: "Run new build (or smoke-official only)"
        required: true
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  NGINX_VERSION: ${{ inputs.nginx_version }}
  ARCH: "aarch64"
  OS: "linux"
  VARIANT: "musl"
  COSIGN_VERSION: "v3.0.6"
  COSIGN_SHA256: "c956e5dfcac53d52bcf058360d579472f0c1d2d9b69f55209e256fe7783f4c74"
  ARTIFACT_BASE: "nginx-${{ inputs.nginx_version }}-aarch64-linux-musl"
  PCRE2_VERSION: "10.44"
  # TODO SSL: OPENSSL_VERSION: "3.x.y"
  # TODO gzip: ZLIB_VERSION: "1.3.1"

jobs:

  get-official:
    name: "Get official nginx + SAST"
    runs-on: ubuntu-24.04-arm

    permissions:
      contents: read

    steps:
      - name: "Install nginx from apt"
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends nginx netcat-openbsd
          NGINX_BIN=$(which nginx)
          echo "time=$(date -u +%Y-%m-%dT%H:%M:%SZ) level=info event=official_installed version=$(nginx -v 2>&1) path=$NGINX_BIN arch=$(uname -m)"
          cp "$NGINX_BIN" /tmp/nginx

      - name: "Upload official binary"
        uses: actions/upload-artifact@6f51ac03b9356f520e9adb1b1b7802705f340c2b  # v4.5.0
        with:
          name: "nginx-official"
          path: /tmp/nginx
          retention-days: 1
          if-no-files-found: error

      - name: "SAST: trivy scan nginx:${{ env.NGINX_VERSION }}-alpine"
        run: |
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh \
            | sh -s -- -b /usr/local/bin
          trivy image \
            --format json \
            --output "${{ env.ARTIFACT_BASE }}.sast.json" \
            --exit-code 0 \
            "nginx:${{ env.NGINX_VERSION }}-alpine"
          echo "time=$(date -u +%Y-%m-%dT%H:%M:%SZ) level=info event=sast target=nginx:${{ env.NGINX_VERSION }}-alpine format=json"

      - name: "Upload SAST report"
        uses: actions/upload-artifact@6f51ac03b9356f520e9adb1b1b7802705f340c2b  # v4.5.0
        with:
          name: "sast-report"
          path: "${{ env.ARTIFACT_BASE }}.sast.json"
          retention-days: 1
          if-no-files-found: error

  smoke-official:
    uses: ./.github/workflows/smoke-tests.yml
    with:
      build_type: "official"
    needs: get-official

  build-native:
    name: "Build nginx ${{ inputs.nginx_version }} aarch64-musl"
    if: ${{ inputs.run_new_build == 'true' }}
    runs-on: ubuntu-24.04-arm
    needs: smoke-official

    permissions:
      contents: read
      id-token: write

    steps:
      - name: "Checkout"
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: "Install musl-tools"
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends musl-tools
          echo "time=$(date -u +%Y-%m-%dT%H:%M:%SZ) level=info event=musl_ready version=$(musl-gcc --version | head -1)"

      - name: "Download PCRE2 ${{ env.PCRE2_VERSION }} source"
        run: |
          curl -fsSL "https://github.com/PCRE2Project/pcre2/releases/download/pcre2-${{ env.PCRE2_VERSION }}/pcre2-${{ env.PCRE2_VERSION }}.tar.gz" \
            -o /tmp/pcre2.tar.gz
          # TODO supply-chain: pinear SHA256 del tarball y verificar antes de extraer.
          cd /tmp && tar -xf pcre2.tar.gz
          test -f /tmp/pcre2-${{ env.PCRE2_VERSION }}/src/pcre2.h.generic
          echo "time=$(date -u +%Y-%m-%dT%H:%M:%SZ) level=info event=pcre2_source_ready version=${{ env.PCRE2_VERSION }}"

      # TODO SSL: agregar step "Download OpenSSL source" análogo a PCRE2.
      # TODO gzip: agregar step "Download zlib source" análogo a PCRE2.

      - name: "Download nginx ${{ env.NGINX_VERSION }} source"
        run: |
          curl -fsSL "https://nginx.org/download/nginx-${{ env.NGINX_VERSION }}.tar.gz" \
            -o /tmp/nginx.tar.gz
          # TODO supply-chain: pinear SHA256 del tarball y verificar antes de extraer.
          cd /tmp && tar -xf nginx.tar.gz
          echo "time=$(date -u +%Y-%m-%dT%H:%M:%SZ) level=info event=source_downloaded version=${{ env.NGINX_VERSION }}"

      - name: "Build nginx aarch64 musl static"
        run: |
          cd /tmp/nginx-${{ env.NGINX_VERSION }}
          ./configure \
            --with-cc=musl-gcc \
            --with-cc-opt="-mcpu=cortex-a53 -Os" \
            --with-ld-opt="-static" \
            --with-pcre=/tmp/pcre2-${{ env.PCRE2_VERSION }} \
            --with-http_v2_module \
            --with-http_realip_module \
            --with-http_stub_status_module \
            --without-http_gzip_module \
            --without-http_scgi_module \
            --without-http_uwsgi_module \
            --without-http_fastcgi_module \
            --prefix=/usr/local/nginx \
            --pid-path=/var/run/nginx.pid \
            --error-log-path=/var/log/nginx/error.log \
            --http-log-path=/var/log/nginx/access.log \
            --http-client-body-temp-path=/var/lib/nginx/body \
            --http-proxy-temp-path=/var/lib/nginx/proxy
          # TODO SSL: agregar --with-http_ssl_module y --with-openssl=/tmp/openssl-${OPENSSL_VERSION}
          # TODO gzip: remover --without-http_gzip_module y agregar --with-zlib=/tmp/zlib-${ZLIB_VERSION}
          make -j$(nproc)
          BINARY="objs/nginx"
          echo "time=$(date -u +%Y-%m-%dT%H:%M:%SZ) level=info event=build_done size=$(du -sh $BINARY | cut -f1) sha256=$(sha256sum $BINARY | cut -d' ' -f1)"

      - name: "Compute SHA256"
        uses: wererootops/actions/checksum@8c1bc10217c5f7b1069036d3f71dad903a314c46  # latest
        with:
          path: "/tmp/nginx-${{ env.NGINX_VERSION }}/objs/nginx"
          output_file: "${{ env.ARTIFACT_BASE }}.sha256"

      - name: "Generate SBOM"
        run: |
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh \
            | sh -s -- -b /usr/local/bin
          trivy fs \
            --format cyclonedx \
            --output "${{ env.ARTIFACT_BASE }}.sbom.cdx.json" \
            /tmp/nginx-${{ env.NGINX_VERSION }}/
          echo "time=$(date -u +%Y-%m-%dT%H:%M:%SZ) level=info event=sbom format=cyclonedx"

      - name: "Prepare bundle"
        run: |
          mkdir -p bundle
          cp /tmp/nginx-${{ env.NGINX_VERSION }}/objs/nginx \
            bundle/${{ env.ARTIFACT_BASE }}
          cp ${{ env.ARTIFACT_BASE }}.sha256 bundle/
          cp ${{ env.ARTIFACT_BASE }}.sbom.cdx.json bundle/

      - name: "Sign binary"
        uses: wererootops/actions/sign@8c1bc10217c5f7b1069036d3f71dad903a314c46  # latest
        with:
          path: "bundle/${{ env.ARTIFACT_BASE }}"
          bundle_output: "bundle/${{ env.ARTIFACT_BASE }}.cosign.bundle"
          cosign_version: "${{ env.COSIGN_VERSION }}"
          cosign_sha256: "${{ env.COSIGN_SHA256 }}"

      - name: "Upload binary for verify-binary"
        uses: actions/upload-artifact@6f51ac03b9356f520e9adb1b1b7802705f340c2b  # v4.5.0
        with:
          name: "nginx-compiled"
          path: "bundle/${{ env.ARTIFACT_BASE }}"
          retention-days: 1
          if-no-files-found: error

      - name: "Upload full bundle"
        uses: actions/upload-artifact@6f51ac03b9356f520e9adb1b1b7802705f340c2b  # v4.5.0
        with:
          name: "${{ env.ARTIFACT_BASE }}-bundle"
          path: bundle/
          retention-days: 1
          if-no-files-found: error

  # TODO smoke-compiled: descomentar cuando querramos correr smoke tests contra el
  # binario propio (ahora posible porque runner y target son ambos aarch64).
  # smoke-compiled:
  #   uses: ./.github/workflows/smoke-tests.yml
  #   with:
  #     build_type: "compiled"
  #   needs: build-native

  verify-binary:
    name: "Verify aarch64 binary"
    if: ${{ inputs.run_new_build == 'true' }}
    runs-on: ubuntu-24.04-arm
    needs: build-native

    permissions:
      contents: read

    steps:
      - name: "Download compiled binary"
        uses: actions/download-artifact@95815c38cf2ff2164869cbab79da8d1f422bc89e  # v4.2.1
        with:
          name: "nginx-compiled"
          path: /tmp/nginx-bin

      - name: "Verify binary"
        run: |
          BINARY="/tmp/nginx-bin/${{ env.ARTIFACT_BASE }}"

          ARCH=$(file "$BINARY" | grep -o "aarch64\|ARM aarch64")
          echo "time=$(date -u +%Y-%m-%dT%H:%M:%SZ) level=info event=verify test=arch result=$ARCH"
          echo "$ARCH" | grep -q "aarch64" || { echo "level=error test=arch result=fail"; exit 1; }

          INTERP=$(readelf -l "$BINARY" 2>/dev/null | grep "program interpreter" || echo "none")
          echo "time=$(date -u +%Y-%m-%dT%H:%M:%SZ) level=info event=verify test=static interp=$INTERP"
          [ "$INTERP" = "none" ] || { echo "level=error test=static result=fail interp=$INTERP"; exit 1; }

          echo "time=$(date -u +%Y-%m-%dT%H:%M:%SZ) level=info event=verify result=pass"

  publish:
    name: "Publish release"
    if: ${{ inputs.run_new_build == 'true' }}
    runs-on: ubuntu-24.04-arm
    needs: verify-binary

    permissions:
      contents: read

    steps:
      - name: "Download full bundle"
        uses: actions/download-artifact@95815c38cf2ff2164869cbab79da8d1f422bc89e  # v4.2.1
        with:
          name: "${{ env.ARTIFACT_BASE }}-bundle"
          path: bundle/

      - name: "Download SAST report"
        uses: actions/download-artifact@95815c38cf2ff2164869cbab79da8d1f422bc89e  # v4.2.1
        with:
          name: "sast-report"
          path: bundle/

      - name: "Package release"
        uses: wererootops/actions/release@8c1bc10217c5f7b1069036d3f71dad903a314c46  # latest
        with:
          binary_path: "bundle/${{ env.ARTIFACT_BASE }}"
          binary_name: "nginx"
          version: "${{ env.NGINX_VERSION }}"
          arch: "aarch64"
          os: "linux"
          variant: "musl"
          sha256_path: "bundle/${{ env.ARTIFACT_BASE }}.sha256"
          sbom_path: "bundle/${{ env.ARTIFACT_BASE }}.sbom.cdx.json"
          cosign_bundle_path: "bundle/${{ env.ARTIFACT_BASE }}.cosign.bundle"
          sast_report_path: "bundle/${{ env.ARTIFACT_BASE }}.sast.json"
          output_dir: "rc"

      - name: "Upload release candidate"
        uses: actions/upload-artifact@6f51ac03b9356f520e9adb1b1b7802705f340c2b  # v4.5.0
        with:
          name: "${{ env.ARTIFACT_BASE }}"
          path: rc/
          retention-days: 14
          if-no-files-found: error
