# Smoke test configuration for nginx-cache-build CI.
# Not for production use.
#
# Port 18080: avoids conflicts with any service on the runner.
# Temp paths in /tmp: runner does not run as root.
#
# Upstream error test strategy:
#   /upstream-timeout uses 10.255.255.1 (RFC 5737 non-routable) to force a
#   real connect timeout and produce 504. This distinguishes "upstream did not
#   respond" from "upstream refused the connection".
#
#   /upstream-refused uses 127.0.0.1:19999 (nothing listening) to produce an
#   immediate connection refused and a 502. This is a distinct failure mode
#   from timeout and matters operationally (CDN/proxy debugging).
#
# Both are intentional: 502 != 504, and collapsing them loses signal.

pid        /tmp/nginx-smoke.pid;
error_log  /tmp/nginx-smoke-error.log;

events {
    worker_connections 64;
}

http {
    access_log off;

    client_body_temp_path  /tmp/nginx-smoke-client;
    proxy_temp_path        /tmp/nginx-smoke-proxy;

    server {
        listen 18080;

        location /health {
            return 200 "ok";
        }

        location /old {
            return 301 /health;
        }

        location /upstream-timeout {
            proxy_pass            http://10.255.255.1:19999;
            proxy_connect_timeout 2s;
            proxy_read_timeout    2s;
        }

        location /upstream-refused {
            proxy_pass            http://127.0.0.1:19999;
            proxy_connect_timeout 1s;
            proxy_read_timeout    1s;
        }
    }
}
